fn emit(text const byte[:]) {
	var start = 0;
	while start < text.len {
		var e = start;
		while e < text.len && text[e] != 10 { e++; }
		let line = text[start..e];
		if line.len == 0 {
			print(".");
		} else if line.len > 100 {
			print(line[..20], "~", line.len);
		} else {
			print(line);
		}
		start = e + 1;
	}
}
