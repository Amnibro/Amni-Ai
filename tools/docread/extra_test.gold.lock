fn show(name const byte[:], which int) {
	var path byte[>..] = [];
	path.append("tests/fixtures/");
	path.append(name);
	var data byte[>..] = [];
	if !read_file(path, data) {
		print("missing ", name);
		return;
	}
	var dot = -1;
	for i in name.len {
		if name[i] == '.' { dot = i; }
	}
	let lang = if dot >= 0 { name[dot + 1..] } else { name[..] };
	run(name, which, lang, data);
}
