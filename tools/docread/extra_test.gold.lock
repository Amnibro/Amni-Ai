fn run(label const byte[:], which int, lang const byte[:], data const byte[:]) {
	let kind = match which { 1 => "ipynb", 2 => "ics", 3 => "vcf", _ => "code", };
	let unit = match which { 1 => "cell", 2 => "event", 3 => "card", _ => "line", };
	dm::dm_reset(kind, unit);
	var ok = true;
	match which {
		1 => { ok = extra::ex_ipynb(data); },
		2 => { ok = extra::ex_ics(data); },
		3 => { ok = extra::ex_vcf(data); },
		_ => { ok = extra::ex_code(data, lang); },
	}
	print("== ", label);
	var md byte[>..] = [];
	dm::dm_markdown(md);
	emit(md);
	var meta byte[>..] = [];
	meta.append(dm::dm_meta);
	var start = 0;
	while start < meta.len {
		var e = start;
		while e < meta.len && meta[e] != 10 { e++; }
		let line = meta[start..e];
		var t = 0;
		while t < line.len && line[t] != 9 { t++; }
		if t < line.len {
			print("meta ", line[..t], "=", line[t + 1..]);
		} else {
			print("meta ", line, "=");
		}
		start = e + 1;
	}
	var warn byte[>..] = [];
	warn.append(dm::dm_warn);
	start = 0;
	while start < warn.len {
		var e = start;
		while e < warn.len && warn[e] != 10 { e++; }
		print("warn ", warn[start..e]);
		start = e + 1;
	}
	if !ok { print("reader returned false"); }
}
