fn ext_row(list const byte[:]) {
	var out byte[>..] = [];
	out.append("ext");
	let parts = split(list, ' ');
	for p in parts {
		let ext const byte[:] = if p == "_" { "" } else { p };
		out.push(' ');
		out.append(p);
		out.push(':');
		if extra::ex_is_code_ext(ext) { out.push('1'); } else { out.push('0'); }
	}
	print(out);
}
