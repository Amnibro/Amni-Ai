fn ht_close(name const byte[:]) {
	if name == "head" { ht_head = false; return; }
	if name.len == 2 && name[0] == 'h' && name[1] >= '1' && name[1] <= '6' {
		ht_flush();
		ht_kind();
		return;
	}
	if name == "pre" {
		if ht_pre > 0 { ht_pre -= 1; }
		if ht_pre == 0 {
			if ht_incell {
				ht_buf.push(' ');
			} else {
				ht_flush();
				ht_kind();
			}
		}
		return;
	}
	if name == "blockquote" {
		ht_flush();
		if ht_quote > 0 { ht_quote -= 1; }
		ht_kind();
		return;
	}
	if name == "ul" || name == "ol" {
		ht_flush();
		if ht_lst.len > 0 { ht_lst.pop(); }
		ht_kind();
		return;
	}
	if name == "li" {
		ht_flush();
		ht_kind();
		return;
	}
	if name == "td" || name == "th" {
		if ht_tdep == 1 {
			ht_cell_end();
		} else if ht_tdep > 1 {
			ht_buf.push(' ');
		}
		return;
	}
	if name == "tr" {
		if ht_tdep == 1 { ht_row_end(); }
		return;
	}
	if name == "table" { ht_end_table(); return; }
	if ht_in(HT_BLOCKS, name) { ht_flush(); }
}
