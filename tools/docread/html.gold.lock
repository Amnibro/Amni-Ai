	if name == "pre" {
		if ht_incell {
			ht_pre += 1;
			ht_buf.push(' ');
		} else {
			ht_flush();
			ht_pre += 1;
			ht_first = true;
			ht_bk = dm::DM_CODE;
			ht_bl = 0;
		}
		return;
	}
	if name.len == 2 && name[0] == 'h' && name[1] >= '1' && name[1] <= '6' {
		ht_flush();
		ht_bk = dm::DM_HEAD;
		ht_bl = name[1] - '0';
		return;
