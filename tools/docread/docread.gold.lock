	var x byte[>..] = [];
	if env("DOCREAD_PASSWORD", x) {
		dr_pw.clear();
		dr_pw.append(x);
		dcrypt::dc_pw.clear();
		dcrypt::dc_pw.append(x);
	}
	let av = args();
	if av.len < 2 {
		dr_usage();
		return;
	}
	let mode = av[1];
	if mode == "mcp" {
		dr_mcp();
		exit(0);
		return;
	}
	var fs = 2;
	if mode == "md" || mode == "json" || mode == "info" || mode == "sniff" {
		fs = 2;
	} else if mode == "chunks" || mode == "images" {
		fs = 3;
	} else if mode == "ask" {
		fs = 4;
	} else {
		dr_usage();
		return;
	}
	if av.len <= fs {
		dr_usage();
		return;
	}
	var fl const byte[:][>..] = [];
	for i in fs..av.len {
		fl.push(av[i][0..av[i].len]);
	}
	if mode == "images" {
		dr_images(av[2][0..av[2].len], fl);
		return;
	}
	if mode == "sniff" {
		var data byte[>..] = [];
		for f in fl {
			data.clear();
			var line byte[>..] = [];
			line.append(f);
			line.push(9);
			if read_file(f, data) {
				line.append(dr_kind_names[dr_sniff(f, data)]);
			} else {
				line.append(dr_kind_names[DR_UNKNOWN]);
			}
			line.push('\n');
			write_stdout(line);
		}
		exit(0);
		return;
	}
	let n = dr_load(fl);
	if n == 0 {
		dr_warn_out();
		exit(1);
		return;
	}
	var out byte[>..] = [];
	if mode == "md" {
		dm::dm_markdown(out);
		write_stdout(out);
		dr_warn_out();
	} else if mode == "json" {
		dm::dm_json(out);
		out.push('\n');
		write_stdout(out);
	} else if mode == "info" {
		dr_info_json(out);
		out.push('\n');
		write_stdout(out);
	} else if mode == "chunks" {
		let m, ok = parse_int(av[2]);
		var mx = 1200;
		if ok { mx = m; }
		dr_chunks_json(clamp(mx, 200, 20000), out);
		write_stdout(out);
	} else if mode == "ask" {
		let kv, ok = parse_int(av[2]);
		var k = 5;
		if ok { k = kv; }
		dm::dm_chunk(1200);
		dm::dm_ask(av[3], clamp(k, 1, 50), out);
		write_stdout(out);
	}
	exit(0);
}
