fn dm_stem(t byte[>..]&) {
	if t.len <= 3 { return; }
	if ends_with(t, "ies") {
		t.pop_n(3);
		t.push('y');
	} else if ends_with(t, "sses") {
		t.pop_n(2);
	} else if t[t.len - 1] == 's' && !(ends_with(t, "ss") || ends_with(t, "us") || ends_with(t, "is")) {
		t.pop_n(1);
	}
	if ends_with(t, "ing") && t.len - 3 >= 3 {
		t.pop_n(3);
	} else if ends_with(t, "ed") && t.len - 2 >= 3 {
		t.pop_n(2);
	}
	if t.len >= 1 && t[t.len - 1] == 'e' && t.len - 1 >= 4 {
		t.pop_n(1);
	}
}
