fn report(tag const byte[:], data const byte[:]) {
	let h = cfb::cf_open(data);
	let cnt = cfb::cf_count(h);
	print(tag, " handle ", h, " count ", cnt);
	if h < 0 { return; }
	for i in cnt {
		if i == 0 {
			print(tag, " ", i, " ", kind(h, i), " ", cfb::cf_size(h, i), " ", "-");
		} else {
			print(tag, " ", i, " ", kind(h, i), " ", cfb::cf_size(h, i), " ", cfb::cf_path(h, i));
		}
	}
	let bigi = cfb::cf_find(h, "Dir/Big");
	print(tag, " read ", same(h, "Small", 40, 1), " ", same(h, "Dir/Mid", 70, 3), " ", same(h, "Dir/Big", cfb::cf_size(h, bigi), 5), " ", same(h, "zed", 0, 1));
	var bs byte[>..] = [];
	bs.append("Dir");
	bs.push(92);
	bs.append("Mid");
	print(tag, " find ", cfb::cf_find(h, "dir/BIG"), " ", cfb::cf_find(h, "/Dir/Mid"), " ", cfb::cf_find(h, "Dir"), " ", cfb::cf_find(h, ""), " ", cfb::cf_find(h, "Dir/Nope"), " ", cfb::cf_find(h, bs));
	cfb::cf_close(h);
}
