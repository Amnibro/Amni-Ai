fn put_line(line const byte[:]) {
	var n = line.len;
	if n > 0 && line[n - 1] == 13 { n -= 1; }
	if n == 0 {
		print(".");
	} else {
		print(line[..n]);
	}
}
fn put(text const byte[:]) {
	var start = 0;
	for i in text.len {
		if text[i] == 10 {
			put_line(text[start..i]);
			start = i + 1;
		}
	}
	if start < text.len {
		put_line(text[start..]);
	}
}
