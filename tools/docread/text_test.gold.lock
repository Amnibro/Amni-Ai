fn neg_line(reader const byte[:], name const byte[:], which int) {
	var path byte[>..] = [];
	path.append("tests/fixtures/");
	path.append(name);
	var data byte[>..] = [];
	read_file(path, data);
	dm::dm_reset("text", "section");
	var ok = false;
	if which == 1 {
		ok = html::ht_read(data);
	} else if which == 2 {
		ok = rtf::rt_read(data);
	} else if which == 3 {
		ok = eml::em_read(data);
	} else {
		ok = textfmt::tx_json(data);
	}
	let word = if ok { "true" } else { "false" };
	print(reader, " on ", name, ": ", word);
}
