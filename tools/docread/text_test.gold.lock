	var kind const byte[:] = "text";
	var unit const byte[:] = "section";
	if which == 1 {
		kind = "html";
	} else if which == 2 {
		kind = "rtf";
	} else if which == 4 || which == 5 || which == 6 || which == 8 {
		kind = "csv";
		unit = "sheet";
	} else if which == 7 {
		kind = "json";
	} else if which == 9 {
		kind = "eml";
		unit = "part";
	}
	dm::dm_reset(kind, unit);
	var ok = true;
	if which == 1 {
		ok = html::ht_read(data);
	} else if which == 2 {
		ok = rtf::rt_read(data);
	} else if which == 3 {
		ok = textfmt::tx_text(data);
	} else if which == 4 {
		ok = textfmt::tx_csv(data, 0);
	} else if which == 5 {
		ok = textfmt::tx_csv(data, 9);
	} else if which == 7 {
		ok = textfmt::tx_json(data);
	} else if which == 9 {
		ok = eml::em_read(data);
	}
	print("== ", name);
	var md byte[>..] = [];
	dm::dm_markdown(md);
	put(md);
	for line in split(dm::dm_meta, 10) {
		if line.len == 0 { continue; }
		var t = 0;
		while t < line.len && line[t] != 9 { t++; }
		if t < line.len {
			print("meta ", line[..t], "=", line[t + 1..]);
		} else {
			print("meta ", line, "=");
		}
	}
	for line in split(dm::dm_warn, 10) {
		if line.len == 0 { continue; }
		print("warn ", line);
	}
	if !ok {
		print("reader returned false");
	}
}
