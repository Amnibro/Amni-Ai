fn gl_part(name const byte[:], out byte[>..]&) bool {
	if name.len == 0 { return false; }
	if name.len >= 3 && starts_with(name, "uni") {
		var cps int[>..] = [];
		if gl_hex(name[3..], cps) {
			for c in cps { dm::dm_put_cp(out, c); }
			return true;
		}
	}
	if name.len >= 5 && name.len <= 7 && name[0] == 'u' {
		var v = 0;
		var good = true;
		for k in 1..name.len {
			let h = gl_hexval(name[k]);
			if h < 0 { good = false; } else { v = v * 16 + h; }
		}
		if good {
			dm::dm_put_cp(out, v);
			return true;
		}
	}
	if name.len == 1 {
		let c = name[0];
		if (c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') {
			dm::dm_put_cp(out, c);
			return true;
		}
	}
	gl_build();
	for n in gl_index.len {
		if gl_len[n] == name.len && n < GL_CPS.len {
			let st = gl_index[n];
			if GL_NAMES[st..st + gl_len[n]] == name {
				dm::dm_put_cp(out, GL_CPS[n]);
				return true;
			}
		}
	}
