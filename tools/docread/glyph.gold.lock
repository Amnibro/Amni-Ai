}
fn gl_name_to_text(name const byte[:], out byte[>..]&) bool {
	var p = 0;
	while p < name.len && name[p] != '.' { p++; }
	let base = name[..p];
	if base.len == 0 { return false; }
	let start = out.len;
	var i = 0;
	while i <= base.len {
		let st = i;
		while i < base.len && base[i] != '_' { i++; }
		if !gl_part(base[st..i], out) {
			out.resize(start, 0);
			return false;
		}
		i++;
	}
	true
}
