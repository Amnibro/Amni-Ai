fn gl_hexval(c int) int {
	if c >= '0' && c <= '9' { c - '0' }
	else if c >= 'a' && c <= 'f' { c - 'a' + 10 }
	else if c >= 'A' && c <= 'F' { c - 'A' + 10 }
	else { -1 }
}
fn gl_hex(s const byte[:], out int[>..]&) bool {
	out.clear();
	if s.len == 0 || s.len % 4 != 0 { return false; }
	var i = 0;
	while i < s.len {
		var v = 0;
		for k in 4 {
			let h = gl_hexval(s[i + k]);
			if h < 0 { return false; }
			v = v * 16 + h;
		}
		out.push(v);
		i += 4;
	}
	true
}
