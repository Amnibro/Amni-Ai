fn pc_run_page(p int) bool {
	pc_reset_page(p);
	guard p >= 0 && p < pdf::pf_pages.len else { return false; }
	let pg .= pdf::pf_pages[p];
	let c = pdf::pf_dget(pg.node, "Contents");
	var buf byte[>..] = [];
	var part byte[>..] = [];
	var any = false;
	let k = pdf::pf_kind(c);
	if k == pdf::PF_STREAM {
		part.clear();
		if pdf::pf_decode(c, part) {
			buf.append(part);
			buf.push('\n');
			any = true;
		}
	} else if k == pdf::PF_ARR {
		for i in pdf::pf_len(c) {
			let e = pdf::pf_at(c, i);
			part.clear();
			if pdf::pf_decode(e, part) {
				buf.append(part);
				buf.push('\n');
				any = true;
			}
		}
	}
	if !any { return false; }
	pc_exec(buf, pg.res, 0);
	if pc_at_on { pc_end_at(); }
	return true;
}
