	for i in 256 {
		j = (j + (s[i] as int) + (key[i % key.len] as int)) % 256;
		let t = s[i];
		s[i] = s[j];
		s[j] = t;
	}
	var a = 0;
	var b = 0;
	for n in d.len {
		a = (a + 1) % 256;
		b = (b + (s[a] as int)) % 256;
		let t = s[a];
		s[a] = s[b];
		s[b] = t;
		let k = s[((s[a] as int) + (s[b] as int)) % 256];
		out.push(d[n] ^ k);
	}
