fn dc_aes_cbc_dec(key const byte[:], d const byte[:], out byte[>..]&) bool {
	out.clear();
	if d.len < 16 { return true; }
	dc_init();
	let a = crypto::aes_key(key);
	let nblk = d.len / 16 - 1;
	for b in nblk {
		var o byte[16];
		dc_aes_dec(a, d[16 + b * 16..32 + b * 16], o);
		for i in 16 { out.push(o[i] ^ d[b * 16 + i]); }
	}
	if out.len > 0 {
		let p = out[out.len - 1] as int;
		if p >= 1 && p <= 16 && p <= out.len {
			var good = true;
			for i in p {
				if (out[out.len - 1 - i] as int) != p { good = false; }
			}
			if good { out.pop_n(p); }
		}
	}
	true
}
