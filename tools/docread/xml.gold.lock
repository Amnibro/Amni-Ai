fn xm_attr_next(s const byte[:], p int&, nat int&, nlen int&, vat int&, vlen int&) bool {
	let n = s.len;
	while true {
		while p < n && (xm_ws(s[p]) || s[p] == 47) { p++; }
		if p >= n { return false; }
		let st = p;
		while p < n && !xm_ws(s[p]) && s[p] != 61 { p++; }
		if p == st {
			p++;
			continue;
		}
		nat = st;
		nlen = p - st;
		while p < n && xm_ws(s[p]) { p++; }
		vat = p;
		vlen = 0;
		if p < n && s[p] == 61 {
			p++;
			while p < n && xm_ws(s[p]) { p++; }
			if p < n && (s[p] == 34 || s[p] == 39) {
				let q = s[p];
				p++;
				vat = p;
				while p < n && s[p] != q { p++; }
				vlen = p - vat;
				if p < n { p++; }
			} else {
				vat = p;
				while p < n && !xm_ws(s[p]) { p++; }
				vlen = p - vat;
			}
		}
		return true;
	}
	return false;
}
