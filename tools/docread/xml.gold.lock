	let par = if xm_stk.len > 0 { xm_stk[xm_stk.len - 1] } else { -1 };
	xm_ev.push(XmEv { kind: XM_TEXT, at: before, len: added, aat: 0, alen: 0, parent: par, mate: -1, depth: xm_stk.len });
}
