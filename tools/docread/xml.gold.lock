fn xm_parse(data const byte[:]) {
	xm_clear();
	dm::dm_to_utf8(data, xm_src);
	let n = xm_src.len;
	var i = 0;
	while i < n {
		if xm_src[i] != 60 {
			var j = i;
			while j < n && xm_src[j] != 60 { j++; }
			if xm_stk.len > 0 { xm_text_add(xm_src[i..j], true); }
			i = j;
			continue;
		}
		if starts_with(xm_src[i..], "<!--") {
			let e = xm_find_from(i + 4, "-->");
			i = min(e + 3, n);
			continue;
		}
		if starts_with(xm_src[i..], "<![CDATA[") {
			let e = xm_find_from(i + 9, "]]>");
			if xm_stk.len > 0 { xm_text_add(xm_src[i + 9..e], false); }
			i = min(e + 3, n);
			continue;
		}
		if starts_with(xm_src[i..], "<?") {
			let e = xm_find_from(i + 2, "?>");
			i = min(e + 2, n);
			continue;
		}
		if starts_with(xm_src[i..], "<!") {
			var j = i + 2;
			while j < n && xm_src[j] != 62 {
				if xm_src[j] == 91 {
					while j < n && xm_src[j] != 93 { j++; }
				}
				j++;
			}
			i = min(j + 1, n);
			continue;
		}
		if starts_with(xm_src[i..], "</") {
			var j = i + 2;
			while j < n && !xm_ws(xm_src[j]) && xm_src[j] != 62 { j++; }
			let nat = i + 2;
			let nlen = j - nat;
			var e = j;
			while e < n && xm_src[e] != 62 { e++; }
			xm_end_tag(nat, nlen);
			i = min(e + 1, n);
			continue;
		}
		if i + 1 < n && xm_name_start(xm_src[i + 1]) {
			var j = i + 1;
			while j < n && !xm_ws(xm_src[j]) && xm_src[j] != 47 && xm_src[j] != 62 { j++; }
			let e = xm_tag_end(j);
			var k = e;
			while k > j && xm_ws(xm_src[k - 1]) { k--; }
			var empty = false;
			var aend = e;
			if k > j && xm_src[k - 1] == 47 {
				empty = true;
				aend = k - 1;
				while aend > j && xm_ws(xm_src[aend - 1]) { aend--; }
			}
			xm_open(i + 1, j - (i + 1), j, aend - j, empty);
			i = min(e + 1, n);
			continue;
		}
		if xm_stk.len > 0 { xm_text_add(xm_src[i..i + 1], true); }
		i++;
	}
	while xm_stk.len > 0 { xm_close_top(); }
}
