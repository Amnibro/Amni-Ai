fn xm_attr_get(i int, mode int, name const byte[:], out byte[>..]&) bool {
	out.clear();
	if i < 0 || i >= xm_ev.len { return false; }
	let e = xm_ev[i];
	if e.kind != XM_OPEN { return false; }
	let s = xm_src[e.aat..e.aat + e.alen];
	var p = 0;
	var nat = 0;
	var nlen = 0;
	var vat = 0;
	var vlen = 0;
	var best_at = -1;
	var best_len = 0;
	while xm_attr_next(s, p, nat, nlen, vat, vlen) {
		let an = s[nat..nat + nlen];
		var k = an.len;
		while k > 0 && an[k - 1] != 58 { k--; }
		let loc = an[k..];
		if mode == 1 {
			if an == name {
				best_at = vat;
				best_len = vlen;
				break;
			}
		} else if mode == 2 {
			if k > 0 && loc == name {
				best_at = vat;
				best_len = vlen;
				break;
			}
		} else if loc == name {
			if k == 0 {
				best_at = vat;
				best_len = vlen;
				break;
			}
			if best_at < 0 {
				best_at = vat;
				best_len = vlen;
			}
		}
	}
	if best_at < 0 { return false; }
	dm::dm_decode_entities(s[best_at..best_at + best_len], out);
	return true;
}
