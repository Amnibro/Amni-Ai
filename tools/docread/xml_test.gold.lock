fn dump() {
	var t byte[>..] = [];
	let n = xml::xm_count();
	for i in n {
		let k = xml::xm_kind(i);
		t.clear();
		if k == xml::XM_OPEN {
			print("O", xml::xm_depth(i), " ", xml::xm_name(i), " c", xml::xm_close_of(i));
		} else if k == xml::XM_CLOSE {
			print("C ", xml::xm_name(i));
		} else {
			xml::xm_text(i, t);
			print("T ", t);
		}
	}
}
