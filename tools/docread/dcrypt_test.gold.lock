fn hex(b const byte[:]) byte[>..] {
	let digits const byte[:] = "0123456789abcdef";
	var out byte[>..] = [];
	for x in b {
		out.push(digits[(x as int) >> 4]);
		out.push(digits[(x as int) & 15]);
	}
	out
}
fn unhex(s const byte[:]) byte[>..] {
	var out byte[>..] = [];
	hex_decode(s, out);
	out
}
