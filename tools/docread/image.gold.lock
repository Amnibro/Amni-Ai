fn im_kind_name(k int) const byte[:] {
	match k {
		1 => "png",
		2 => "jpeg",
		3 => "gif",
		4 => "webp",
		5 => "tiff",
		6 => "bmp",
		7 => "ico",
		8 => "heic",
		9 => "avif",
		10 => "svg",
		_ => "unknown",
	}
}
