		while p < n && data[p] != 10 { p++; }
		start = min(p + 1, n);
	}
	var stop = n;
	var ls = start;
	var prev_empty = false;
	while ls < n {
		var le = ls;
		while le < n && data[le] != 10 { le++; }
		if prev_empty && le - ls >= 5 && data[ls..ls + 5] == "From " {
			dm::dm_warn_add("mbox holds more than one message; only the first was read");
			stop = ls;
			break;
		}
		var e = le;
		if e > ls && data[e - 1] == 13 { e -= 1; }
		prev_empty = e == ls;
		ls = le + 1;
	}
	let text = data[start..stop];
	if !em_looks(text) { return false; }
	em_message(text, 0, false);
	if em_att_count() > 0 {
		var c byte[>..] = [];
		format(c, em_att_count());
		dm::dm_set_meta("attachments", c);
	}
	true
}
