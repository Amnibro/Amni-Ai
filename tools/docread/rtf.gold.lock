fn rt_find(h const byte[:], n const byte[:]) int {
	if n.len == 0 { return -1; }
	var i = 0;
	while i + n.len <= h.len {
		var j = 0;
		while j < n.len && h[i + j] == n[j] { j++; }
		if j == n.len { return i; }
		i++;
	}
	return -1;
