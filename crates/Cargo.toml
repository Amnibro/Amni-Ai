[workspace]
resolver = "2"
members = ["adam-ray", "adam-qa", "adam-ray-py", "adam-train", "adam-gf17", "adam-vision", "adam-vision-py", "adam-ks"]
exclude = ["amni_ai_core"]
[workspace.dependencies]
adam-ray = { path = "adam-ray" }
adam-qa = { path = "adam-qa" }
adam-vision = { path = "adam-vision" }
[profile.release]
opt-level = 3
[profile.dev]
opt-level = 1
[profile.test]
opt-level = 3
